  <main>
    <div class="slideshow-container" id="slideshow">
      <div class="mySlides fade">
        <img src="resource/img/photography/1.jpg" alt="Photography 1" loading="lazy">
      </div>
      <div class="mySlides fade">
        <img src="resource/img/photography/2.jpg" alt="Photography 2" loading="lazy">
      </div>
      <div class="mySlides fade">
        <img src="resource/img/photography/3.jpg" alt="Photography 3" loading="lazy">
      </div>
      <div class="mySlides fade">
        <img src="resource/img/photography/4.jpg" alt="Photography 4" loading="lazy">
      </div>
      <div class="mySlides fade">
        <img src="resource/img/photography/5.jpg" alt="Photography 5" loading="lazy">
      </div>
      <div class="mySlides fade">
        <img src="resource/img/photography/6.jpg" alt="Photography 6" loading="lazy">
      </div>
      <div class="mySlides fade">
        <img src="resource/img/photography/7.jpg" alt="Photography 7" loading="lazy">
      </div>
      <div class="mySlides fade">
        <img src="resource/img/photography/8.jpg" alt="Photography 8" loading="lazy">
      </div>
      <div class="mySlides fade">
        <img src="resource/img/photography/9.jpg" alt="Photography 9" loading="lazy">
      </div>
      <div class="mySlides fade">
        <img src="resource/img/photography/10.jpg" alt="Photography 10" loading="lazy">
      </div>
      <div class="mySlides fade">
        <img src="resource/img/photography/11.jpg" alt="Photography 11" loading="lazy">
      </div>
    </div>

    <div class="button">
      <button class="w3-button" onclick="plusSlides(-1)">PREV</button>
      <button class="w3-button" onclick="plusSlides(1)">NEXT</button>
    </div>
  </main>

  <script>
    let slideIndex = 1;
    showSlides(slideIndex);

    function plusSlides(n) {
      showSlides(slideIndex += n);
    }

    function currentSlide(n) {
      showSlides(slideIndex = n);
    }

    function showSlides(n) {
      let i;
      let slides = document.getElementsByClassName("mySlides");
      if (n > slides.length) { slideIndex = 1; }    
      if (n < 1) { slideIndex = slides.length; }
      for (i = 0; i < slides.length; i++) {
        slides[i].style.display = "none";  
      }
      slides[slideIndex - 1].style.display = "block";  
    }

    // Mobile Touch Swipe Gesture Support
    let touchstartX = 0;
    let touchstartY = 0;
    let touchendX = 0;
    let touchendY = 0;
    const container = document.getElementById('slideshow');

    container.addEventListener('touchstart', function(e) {
      touchstartX = e.changedTouches[0].screenX;
      touchstartY = e.changedTouches[0].screenY;
    }, { passive: true });

    container.addEventListener('touchend', function(e) {
      touchendX = e.changedTouches[0].screenX;
      touchendY = e.changedTouches[0].screenY;
      handleGesture();
    }, { passive: true });

    function handleGesture() {
      let deltaX = touchendX - touchstartX;
      let deltaY = touchendY - touchstartY;
      // Trigger swipe only if horizontal drag is dominant and sufficiently long (> 30px)
      if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 30) {
        if (deltaX < 0) {
          plusSlides(1); // Swipe Left -> Next
        } else {
          plusSlides(-1); // Swipe Right -> Prev
        }
      }
    }

    // Keyboard Arrow Key Navigation
    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowLeft') plusSlides(-1);
      if (e.key === 'ArrowRight') plusSlides(1);
    });
  </script>
</body>
