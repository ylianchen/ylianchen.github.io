    <div class="button">
      <button class="w3-button" id="prev-btn" onclick="plusSlides(-1)" aria-label="Previous image">PREV</button>
      <span id="slide-counter" aria-live="polite">01 / 16</span>
      <button class="w3-button" id="next-btn" onclick="plusSlides(1)" aria-label="Next image">NEXT</button>
    </div>
  </main>

  <script>
    let currentCategory = 'urban';
    let slideIndex = 1;

    // Track position per category so returning to a category keeps your place
    const categoryIndices = {
      urban: 1,
      portrait: 1,
      land: 1
    };

    function getCategorySlides(cat) {
      return document.querySelectorAll(`.mySlides[data-category="${cat}"]`);
    }

    function switchCategory(catKey, pushHash = true) {
      if (!categoryIndices.hasOwnProperty(catKey)) {
        catKey = 'urban';
      }
      currentCategory = catKey;
      slideIndex = categoryIndices[catKey] || 1;

      // Update active tab button
      document.querySelectorAll('.gallery-tab').forEach(tab => {
        if (tab.dataset.target === catKey) {
          tab.classList.add('active');
        } else {
          tab.classList.remove('active');
        }
      });

      // Update URL hash if requested
      if (pushHash && window.location.hash.replace('#', '') !== catKey) {
        history.replaceState(null, '', '#' + catKey);
      }

      showSlides(slideIndex);
    }

    function plusSlides(n) {
      showSlides(slideIndex += n);
    }

    function showSlides(n) {
      const allSlides = document.querySelectorAll('.mySlides');
      const catSlides = getCategorySlides(currentCategory);
      const total = catSlides.length;

      if (total === 0) return;

      if (n > total) { slideIndex = 1; }
      if (n < 1) { slideIndex = total; }
      categoryIndices[currentCategory] = slideIndex;

      // Hide all slides
      allSlides.forEach(slide => {
        slide.style.display = 'none';
      });

      // Display current slide
      catSlides[slideIndex - 1].style.display = 'flex';

      // Update counter with clean leading-zero format
      const currentStr = String(slideIndex).padStart(2, '0');
      const totalStr = String(total).padStart(2, '0');
      const counterEl = document.getElementById('slide-counter');
      if (counterEl) {
        counterEl.textContent = `${currentStr} / ${totalStr}`;
      }
    }

    // Initialize from URL hash or default to 'urban'
    function initGallery() {
      const hash = window.location.hash.replace('#', '').toLowerCase();
      if (hash && categoryIndices.hasOwnProperty(hash)) {
        switchCategory(hash, false);
      } else {
        switchCategory('urban', false);
      }
    }

    window.addEventListener('hashchange', () => {
      const hash = window.location.hash.replace('#', '').toLowerCase();
      if (hash && categoryIndices.hasOwnProperty(hash) && hash !== currentCategory) {
        switchCategory(hash, false);
      }
    });

    initGallery();

    // Mobile Touch Swipe Gesture Support
    let touchstartX = 0;
    let touchstartY = 0;
    let touchendX = 0;
    let touchendY = 0;
    const container = document.getElementById('slideshow');

    container.addEventListener('touchstart', function(e) {
      touchstartX = e.changedTouches[0].screenX;
      touchstartY = e.changedTouches[0].screenY;
    }, { passive: true });

    container.addEventListener('touchend', function(e) {
      touchendX = e.changedTouches[0].screenX;
      touchendY = e.changedTouches[0].screenY;
      handleGesture();
    }, { passive: true });

    function handleGesture() {
      let deltaX = touchendX - touchstartX;
      let deltaY = touchendY - touchstartY;
      if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 30) {
        if (deltaX < 0) {
          plusSlides(1); // Swipe Left -> Next
        } else {
          plusSlides(-1); // Swipe Right -> Prev
        }
      }
    }

    // Keyboard Arrow Key Navigation
    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowLeft') plusSlides(-1);
      if (e.key === 'ArrowRight') plusSlides(1);
    });
  </script>
